name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [unit, contracts, eslint, dependencies, packaging]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Protect the installed Node toolchain on the disposable hosted runner
        run: node tooling/prepare-hosted-node.cjs --execute
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: matrix.check == 'unit'
        run: npm test
      - if: matrix.check == 'contracts'
        run: npm run test:contracts
      - if: matrix.check == 'eslint'
        run: npm run lint
      - if: matrix.check == 'dependencies'
        run: npm audit --omit=dev
      - if: matrix.check == 'dependencies'
        name: Development dependency audit
        run: npm audit --include=dev
      - if: matrix.check == 'packaging'
        run: npm run test:package
      - if: matrix.check == 'packaging'
        name: Secure evidence destinations (real filesystem and foreign UID)
        run: python3 -B -m unittest discover -s test/security -p '*_test.py' -v
