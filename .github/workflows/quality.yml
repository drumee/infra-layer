name: Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [unit, contracts, eslint, dependencies, packaging]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Protect the installed Node toolchain on the disposable hosted runner
        run: node tooling/prepare-hosted-node.cjs --execute
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: matrix.check == 'unit'
        run: npm test
      - if: matrix.check == 'contracts'
        run: npm run test:contracts
      - if: matrix.check == 'eslint'
        run: npm run lint
      - if: matrix.check == 'dependencies'
        run: npm audit --omit=dev
      - if: matrix.check == 'dependencies'
        name: Development dependency audit
        run: npm audit --include=dev
      - if: matrix.check == 'packaging'
        run: npm run test:package
